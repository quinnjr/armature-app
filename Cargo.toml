[package]
name = "armature-app"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-app"
homepage = "https://quinnjr.github.io/armature"
description = "Build complete Armature applications in Rhai scripts"
keywords = ["rhai", "scripting", "web", "framework", "application"]
categories = ["web-programming", "development-tools"]

[dependencies]
armature-core = { version = "0" }
armature-rhai = { version = "0" }

rhai = { version = "1.25", features = ["sync", "serde", "metadata"] }
tokio = { version = "1.52", features = ["sync", "fs", "time", "rt-multi-thread", "macros", "signal"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal", "test-util"] }
tempfile = "3.27"
